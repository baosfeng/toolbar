name: Bug 反馈
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有同类 issue。日志可在「控制台.app」中过滤 NetworkMonitor 获取。

  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么，期望是什么
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开菜单面板
        2. 点击「额度」
        3. 看到...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 1.3.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 系统环境
      placeholder: macOS 15.1 / Apple M1 Pro
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 控制台日志、崩溃堆栈或界面截图
      render: shell
    validations:
      required: false
