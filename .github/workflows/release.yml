name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或重发的 tag（如 v1.20.0）"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 / x86_64 都跑 macOS 26 镜像：只有它的默认 Xcode 是 26.6（Swift 6.3+），
          # 才满足 swift-tools-version: 6.3；macos-15 系默认仍是 Xcode 16.4（Swift 6.1），
          # 会在 swift build 第一步就报「using Swift tools version 6.3.0 but the installed version is 6.1.0」
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    env:
      # 配置了签名证书则走证书签名，否则由脚本回退 ad-hoc
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true
          uname -m

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # tag 与 App 内的 CFBundleShortVersionString 必须一致：发 v1.20.0 却忘改 plist 时
      # Release 标题写 1.20.0、用户下载到的「关于」却显示旧版本，属于静默错版
      # （版本号唯一真源是 build-app.sh 里的内联 Info.plist，仓库中没有独立模板）
      - name: Version matches tag
        working-directory: NetworkMonitor
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          [ -n "${INPUT_TAG:-}" ] && tag_version="${INPUT_TAG#v}"
          plist_version=$(grep -A1 '<key>CFBundleShortVersionString</key>' Scripts/build-app.sh \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | head -1)
          echo "tag=${tag_version} plist=${plist_version}"
          if [ "${tag_version}" != "${plist_version}" ]; then
            echo "::error::tag 与 build-app.sh 的 CFBundleShortVersionString ${plist_version} 不一致"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build, sign and package
        working-directory: NetworkMonitor
        env:
          BUILD_SYSTEM: default
          SKIP_INSTALL: "1"
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'NetworkMonitor Local Signing' }}
        run: ./Scripts/build-app.sh release

      # 产物架构自证：脚本按 ARCH 交叉构建时若参数没生效，这里会红而不是静默发出错包
      - name: Verify binary architecture
        working-directory: NetworkMonitor
        run: |
          BIN="dist/NetworkMonitor-${{ matrix.arch }}.app/Contents/MacOS/NetworkMonitor"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "${{ matrix.arch }}"

      - name: Show signature
        working-directory: NetworkMonitor
        run: codesign -dv --verbose=2 "dist/NetworkMonitor-${{ matrix.arch }}.app" 2>&1 | head -8

      - name: Zip app bundle
        working-directory: NetworkMonitor
        run: |
          ditto -c -k --keepParent "dist/NetworkMonitor-${{ matrix.arch }}.app" \
            "dist/NetworkMonitor-${{ matrix.arch }}.app.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetworkMonitor-${{ matrix.arch }}
          path: NetworkMonitor/dist/NetworkMonitor-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 两个架构各自上传 artifact，这里一次性取回再建 release：
      # 让矩阵里的 job 各自 softprops/action-gh-release 会并发建同一个 release，撞 422
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: NetworkMonitor-*
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NetworkMonitor ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
