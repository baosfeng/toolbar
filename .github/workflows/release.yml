name: Release

# 发版产物是五个文件（三个 dmg + 校验和 + 更新清单）：
#   Yilan-<版本>.dmg           —— universal（arm64 + x86_64 双架构），默认给不知道芯片的人
#   Yilan-<版本>-arm64.dmg     —— 只含 arm64，体积约为 universal 的一半
#   Yilan-<版本>-x86_64.dmg    —— 只含 x86_64，Intel 用户不必下整包
#   SHA256SUMS.txt             —— 三个 dmg 的校验和（shasum -a 256 -c 可验）
#   update.json                —— 自动更新器的静态更新通道（见 Scripts/make-update-manifest.py）
#
# 三个 dmg 挂载后都是「一览.app」：包名进了「应用程序」就是最终名字，用户不该看到架构信息。
# 为什么不再发 zip：zip 解压出来是构建目录里的包名「一览-arm64.app」，拖进「应用程序」
# 就带上了架构后缀 —— 这正是用户反馈的问题，localhost 预览与 CI 都改走 make-dmg.sh。
#
# 为什么还要单架构包：universal 装到哪台机器上都对，但每个用户都白下了一半别人的架构；
# 更新器按清单 platforms 表挑自己那一片，下载体积直接减半。
#
# 为什么发版要两台 runner：随包携带的 zstd / libzstd 是 Homebrew 二进制（单架构），
# 必须在各自的架构机器上打出来，再合并成 universal；单机合并拼不出双架构。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或重发的 tag（如 v1.30.0）"
        required: true

permissions:
  contents: write

# 同一 tag 的发布串行排队：自动触发与手动重发同时出现时，两个 publish 会抢建同一个 release（422），
# 因此按 tag 分组、不打断正在跑的发布，后来的排队等它结束
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个架构都跑 macOS 26 镜像：只有它的默认 Xcode 是 26.6（内置 Swift 6.3.3），
          # 才满足 swift-tools-version: 6.3；macos-15 系默认仍是 Xcode 16.4（Swift 6.1），
          # 会在 swift build 第一步就报「using Swift tools version 6.3.0 but the installed version is 6.1.0」。
          # 默认带 Swift 6.4 的 xcode-27 镜像同样不能用：它只有 arm64（无 Intel 变体）且仍是 preview，
          # 详见 docs/开发指南/构建与测试.md「CI 工具链」
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 工具链展示 / 证书导入 / tag 与 version.env 版本校验，与 ci.yml 共用同一份实现。
      # 签名证书 secret 未配置时 setup-build 自动跳过导入，build-app.sh 回落 ad-hoc 签名
      - name: Setup build
        uses: ./.github/actions/setup-build
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # 缓存编译产物：build-app.sh 的产物目录同样是 .build/<arch>-apple-macosx/release。
      # key 带 rel- 前缀与 CI 的 native 后端分开，避免两套后端共用同一份增量状态；
      # 缓存未命中仍能完整构建（fail-closed），架构自证（lipo）照旧在打包后执行
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: NetworkMonitor/.build/${{ matrix.arch }}-apple-macosx
          key: ${{ runner.os }}-swift-rel-${{ matrix.arch }}-${{ hashFiles('NetworkMonitor/Package.swift', 'NetworkMonitor/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-rel-${{ matrix.arch }}-

      # REQUIRE_SIGNING_CERT=1 是发布门禁：证书找不到时 build-app.sh 直接失败，
      # 不再「打一行警告 就签成 ad-hoc」。v1.30.0 / v1.31.0 两个包正是这么发出去的 ——
      # ad-hoc 的 designated requirement 是 cdhash，逐版本都不同，用户升级后
      # 屏幕录制 / 辅助功能 / 输入监控 / 本地网络 / 登录项全部失配。
      # 日常 CI（ci.yml）不设它：那条链路允许 ad-hoc，只有发布必须是稳定身份。
      - name: Build, sign and package
        working-directory: NetworkMonitor
        env:
          BUILD_SYSTEM: default
          SKIP_INSTALL: "1"
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'NetworkMonitor Local Signing' }}
          REQUIRE_SIGNING_CERT: "1"
        run: ./Scripts/build-app.sh release

      # 产物架构自证：脚本按 ARCH 交叉构建时若参数没生效，这里会红而不是静默发出错包
      - name: Verify binary architecture
        working-directory: NetworkMonitor
        run: |
          # 包内可执行名是「一览」（build-app.sh 的 APP_EXECUTABLE_NAME，打包时由构建产物改名而来）
          BIN="dist/一览-${{ matrix.arch }}.app/Contents/MacOS/一览"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "${{ matrix.arch }}"

      - name: Show signature
        working-directory: NetworkMonitor
        run: codesign -dv --verbose=2 "dist/一览-${{ matrix.arch }}.app" 2>&1 | head -8

      # 中间传递用 tar.gz 而不是 upload-artifact 直接传目录：
      # tar 能可靠保住可执行位与符号链接（解包后 lipo 与 codesign 都依赖它们）
      - name: Archive app bundle for hand-off
        working-directory: NetworkMonitor/dist
        run: tar -czf "yilan-${{ matrix.arch }}.tar.gz" "一览-${{ matrix.arch }}.app"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: yilan-${{ matrix.arch }}
          path: NetworkMonitor/dist/yilan-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  universal:
    name: Universal + per-arch dmgs
    needs: package
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 合并会破坏两个单架构包已有的签名，必须重新签 —— 所以这里也要导入证书
      - name: Setup build
        uses: ./.github/actions/setup-build
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 合并 + 重新签名 + 打三个 dmg（universal 给手动下载，两个单架构给自动更新器按架构分流）
      #
      # 合并会破坏两个单架构包已有的签名，这里重新签一次 —— 同样是发布产物，
      # 同样要求证书（REQUIRE_SIGNING_CERT=1：缺证书就红，不许悄悄发 ad-hoc）。
      # 单架构包直接从解包出来的两个 app 打，不重新构建：合并只是积木，
      # 两份原件本来就是各自架构的完整包，重打一遍 dmg 比走第二遍构建便宜得多
      - name: Merge to universal and build dmgs
        env:
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'NetworkMonitor Local Signing' }}
          REQUIRE_SIGNING_CERT: "1"
        run: |
          set -euo pipefail
          # shellcheck source=NetworkMonitor/version.env
          source NetworkMonitor/version.env
          mkdir -p dist
          tar -xzf artifacts/yilan-arm64/yilan-arm64.tar.gz -C dist
          tar -xzf artifacts/yilan-x86_64/yilan-x86_64.tar.gz -C dist
          bash NetworkMonitor/Scripts/make-universal-app.sh \
            --arm64 "$PWD/dist/一览-arm64.app" \
            --x86_64 "$PWD/dist/一览-x86_64.app" \
            --out "$PWD/dist/一览.app" \
            --dmg "$PWD/dist/Yilan-${VERSION}.dmg"
          # 卷名后缀只影响侧栏显示（同时挂三个卷时不撞名），不改变包内名字
          for arch in arm64 x86_64; do
            bash NetworkMonitor/Scripts/make-dmg.sh \
              "dist/一览-${arch}.app" "dist/Yilan-${VERSION}-${arch}.dmg" "$arch"
          done
          ls -lh dist/*.dmg

      # 合并自证：主可执行文件与随包资源都必须是双架构
      # （zstd / libzstd 单架构时 Intel 用户的 Token 页会静默降级，不能放过）
      - name: Verify universal architecture
        run: |
          set -euo pipefail
          BIN="dist/一览.app/Contents/MacOS/一览"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64
          lipo -info "$BIN" | grep -q x86_64
          for nested in dist/一览.app/Contents/Resources/*.dylib dist/一览.app/Contents/Resources/zstd; do
            [ -f "$nested" ] || continue
            echo "--- $nested"
            lipo -info "$nested"
            lipo -info "$nested" | grep -q arm64 || { echo "缺少 arm64 切片：$nested" >&2; exit 1; }
            lipo -info "$nested" | grep -q x86_64 || { echo "缺少 x86_64 切片：$nested" >&2; exit 1; }
          done

      # 挂载自证：dmg 真能被系统挂上、里面真有「一览.app」、版本号对得上。
      # 这一步失败比用户下载后发现「打不开」便宜得多
      - name: Verify dmg
        run: |
          set -euo pipefail
          source NetworkMonitor/version.env
          dmg="dist/Yilan-${VERSION}.dmg"
          mountpoint="$(mktemp -d)/mnt"
          mkdir -p "$mountpoint"
          hdiutil attach -nobrowse -readonly -noautoopen -quiet -mountpoint "$mountpoint" "$dmg"
          trap 'hdiutil detach "$mountpoint" -quiet >/dev/null 2>&1 || true' EXIT
          test -d "$mountpoint/一览.app" || { echo "dmg 里没有「一览.app」" >&2; exit 1; }
          test -L "$mountpoint/Applications" || { echo "dmg 里缺少「应用程序」快捷方式" >&2; exit 1; }
          actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$mountpoint/一览.app/Contents/Info.plist")
          echo "dmg 内版本：${actual}（期望 ${VERSION}）"
          [ "$actual" = "${VERSION}" ] || { echo "dmg 内版本与 tag 不一致" >&2; exit 1; }

      # 单架构包自证的三件事，任一错都必须是红而不是发出去：
      # 1) 挂载后是「一览.app」而不是「一览-arm64.app」（用户反馈过的老问题，只能靠实挂验证）；
      # 2) 版本对得上 tag（错版本装上去更新器会拒装或反复提示更新）；
      # 3) lipo -archs 只含本架构 —— 打包脚本若回落到「本机构建」，Intel 包会悄悄变成 arm64 包
      - name: Verify per-arch dmgs
        run: |
          set -euo pipefail
          source NetworkMonitor/version.env
          # 中途 exit 1 时也要卸载：残留挂载会占着设备，后面的 dmg 挂不上
          mounted=""
          cleanup() {
            [ -z "$mounted" ] || hdiutil detach "$mounted" -quiet >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for arch in arm64 x86_64; do
            dmg="dist/Yilan-${VERSION}-${arch}.dmg"
            echo "=== $dmg"
            mountpoint="$(mktemp -d)/mnt"
            mkdir -p "$mountpoint"
            hdiutil attach -nobrowse -readonly -noautoopen -quiet -mountpoint "$mountpoint" "$dmg"
            mounted="$mountpoint"
            test -d "$mountpoint/一览.app" || { echo "$dmg 里没有「一览.app」（包名不能带架构后缀）" >&2; exit 1; }
            test -L "$mountpoint/Applications" || { echo "$dmg 里缺少「应用程序」快捷方式" >&2; exit 1; }
            actual=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
              "$mountpoint/一览.app/Contents/Info.plist")
            echo "包内版本：${actual}（期望 ${VERSION}）"
            [ "$actual" = "${VERSION}" ] || { echo "$dmg 内版本与 tag 不一致" >&2; exit 1; }
            bin="$mountpoint/一览.app/Contents/MacOS/一览"
            archs=$(lipo -archs "$bin")
            echo "包内可执行架构：${archs}（期望只含 ${arch}）"
            [ "$archs" = "$arch" ] || { echo "${dmg} 的架构不是纯 ${arch}（实际 ${archs}）" >&2; exit 1; }
            hdiutil detach "$mountpoint" -quiet
            mounted=""
          done

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 Yilan-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yilan-release
          path: |
            dist/Yilan-*.dmg
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: universal
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # release notes 要逐条列出 prev..tag 的提交，需要完整历史与 tag 才能算出上一个 v* tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: yilan-release
          path: artifacts

      - name: List assets
        run: ls -lh artifacts

      # 先用脚本产出逐条明细（按 conventional 前缀分组），再据此生成更新通道清单。
      # 生成器回归先跑：v1.27.0 的正文是发出去才发现「链接 404 + 逐条点不动 + 页脚多一个假贡献者」，
      # 那时改已发布的正文要额外一次 PATCH。这一道红了就别发
      - name: Release notes regression
        run: bash NetworkMonitor/Scripts/test-release-notes.sh

      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          notes_file="release-notes.md"
          printf '%s\n\n' '**下载**：`Yilan-<版本>.dmg` 是 universal 包（Apple Silicon 与 Intel 同一份，拿不准就选它）；`Yilan-<版本>-arm64.dmg` / `Yilan-<版本>-x86_64.dmg` 是单架构包，体积约一半。三个包挂载后都是「一览.app」，拖进「应用程序」即可。应用为本地签名（未公证），首次打开请右键「打开」。' > "$notes_file"
          if bash NetworkMonitor/Scripts/generate-release-notes.sh --tag "$TAG" >> "$notes_file"; then
            echo "::notice::release notes 已由脚本生成"
          else
            echo "::warning::release notes 脚本退出码非 0，回退到通用说明（发布继续）"
            printf '%s\n' '本次发布说明查看下方完整变更链接。' >> "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            printf '%s\n' '本次发布说明查看下方完整变更链接。' > "$notes_file"
          fi
          echo "----- release-notes.md -----"
          cat "$notes_file"
          echo "----------------------------"

      # update.json 与发布说明必须同源：用户看到的「新版本说明」就是 Release 正文那段，
      # 更新器读到的也是这段，正文改一次两边一起变。
      #
      # 三个 dmg 按名字显式点名而不是 ls 取第一个：清单里 asset / platforms 各自关乎哪一份包，
      # 名字挑错就是「Intel 用户下到 arm64 包」，生成器只认 Yilan-<版本>[-<arch>].dmg 的严格形状
      - name: Generate update manifest
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          python3 NetworkMonitor/Scripts/make-update-manifest.py \
            --tag "$TAG" \
            --dmg "artifacts/Yilan-${version}.dmg" \
            --platform-dmg "arm64=artifacts/Yilan-${version}-arm64.dmg" \
            --platform-dmg "x86_64=artifacts/Yilan-${version}-x86_64.dmg" \
            --notes-file release-notes.md \
            --out artifacts/update.json \
            --repo "${GITHUB_REPOSITORY}" \
            --min-system-from NetworkMonitor/Package.swift
          cat artifacts/update.json

      # generate_release_notes 已关闭：官方自动生成只有一行 Full Changelog，与本脚本末尾的完整变更链接重复；
      # 逐条明细由脚本统一口径（中文分组 + 短 hash），避免正文里出现两套说明
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 一览 ${{ inputs.tag || github.ref_name }} · 通用包 + Apple Silicon / Intel 单架构包
          body_path: release-notes.md
          files: |
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
            artifacts/update.json
