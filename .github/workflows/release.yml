name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或重发的 tag（如 v1.20.0）"
        required: true

permissions:
  contents: write

# 同一 tag 的发布串行排队：自动触发与手动重发同时出现时，两个 publish 会抢建同一个 release（422），
# 因此按 tag 分组、不打断正在跑的发布，后来的排队等它结束
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 / x86_64 都跑 macOS 26 镜像：只有它的默认 Xcode 是 26.6（Swift 6.3+），
          # 才满足 swift-tools-version: 6.3；macos-15 系默认仍是 Xcode 16.4（Swift 6.1），
          # 会在 swift build 第一步就报「using Swift tools version 6.3.0 but the installed version is 6.1.0」
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 工具链展示 / 证书导入 / tag 与 plist 版本校验，与 ci.yml 共用同一份实现。
      # 签名证书 secret 未配置时 setup-build 自动跳过导入，build-app.sh 回落 ad-hoc 签名
      - name: Setup build
        uses: ./.github/actions/setup-build
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      # 缓存编译产物：build-app.sh 的产物目录同样是 .build/<arch>-apple-macosx/release。
      # key 带 rel- 前缀与 CI 的 native 后端分开，避免两套后端共用同一份增量状态；
      # 缓存未命中仍能完整构建（fail-closed），架构自证（lipo）照旧在打包后执行；
      # release 配置的产物在同一个目录下（.build/<arch>-apple-macosx/release），命中缓存后同样减少重编时间
      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: NetworkMonitor/.build/${{ matrix.arch }}-apple-macosx
          key: ${{ runner.os }}-swift-rel-${{ matrix.arch }}-${{ hashFiles('NetworkMonitor/Package.swift', 'NetworkMonitor/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-rel-${{ matrix.arch }}-

      - name: Build, sign and package
        working-directory: NetworkMonitor
        env:
          BUILD_SYSTEM: default
          SKIP_INSTALL: "1"
          ARCH: ${{ matrix.arch }}
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'NetworkMonitor Local Signing' }}
        run: ./Scripts/build-app.sh release

      # 产物架构自证：脚本按 ARCH 交叉构建时若参数没生效，这里会红而不是静默发出错包
      - name: Verify binary architecture
        working-directory: NetworkMonitor
        run: |
          BIN="dist/一览-${{ matrix.arch }}.app/Contents/MacOS/NetworkMonitor"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "${{ matrix.arch }}"

      - name: Show signature
        working-directory: NetworkMonitor
        run: codesign -dv --verbose=2 "dist/一览-${{ matrix.arch }}.app" 2>&1 | head -8

      - name: Zip app bundle
        working-directory: NetworkMonitor
        run: |
          # zip 名用 URL 友好的 Yilan-<arch>.app.zip：资产名进下载链接时不会被百分号编码，
          # 解压出来仍是「一览.app」（--keepParent 保留包目录名）
          ditto -c -k --keepParent "dist/一览-${{ matrix.arch }}.app" \
            "dist/Yilan-${{ matrix.arch }}.app.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yilan-${{ matrix.arch }}
          path: NetworkMonitor/dist/Yilan-${{ matrix.arch }}.app.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # release notes 要逐条列出 prev..tag 的提交，需要完整历史与 tag 才能算出上一个 v* tag
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      # 两个架构各自上传 artifact，这里一次性取回再建 release：
      # 让矩阵里的 job 各自 softprops/action-gh-release 会并发建同一个 release，撞 422
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: Yilan-*
          merge-multiple: true

      - name: List assets
        run: ls -lh artifacts

      # 先由脚本产出逐条明细（按 conventional 前缀分组），再用 body_path 作为 release 正文。
      # 脚本自身在无 git 环境时会输出可用文案并 exit 0；真失败也只打 ::warning 不阻断发布
      - name: Generate release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -uo pipefail
          notes_file="release-notes.md"
          printf '%s\n\n' '**下载**：`Yilan-arm64.app.zip` 面向 Apple Silicon，`Yilan-x86_64.app.zip` 面向 Intel；两个 zip 解压后都是「一览.app」。' > "$notes_file"
          if bash NetworkMonitor/Scripts/generate-release-notes.sh --tag "$TAG" >> "$notes_file"; then
            echo "::notice::release notes 已由脚本生成"
          else
            echo "::warning::release notes 脚本退出码非 0，回退到通用说明（发布继续）"
            printf '%s\n' '本次发布说明查看下方完整变更链接。' >> "$notes_file"
          fi
          if [ ! -s "$notes_file" ]; then
            printf '%s\n' '本次发布说明查看下方完整变更链接。' > "$notes_file"
          fi
          echo "----- release-notes.md -----"
          cat "$notes_file"
          echo "----------------------------"

      # generate_release_notes 已关闭：官方自动生成只有一行 Full Changelog，与本脚本末尾的完整变更链接重复；
      # 逐条明细由脚本统一口径（中文分组 + 短 hash），避免正文里出现两套说明
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: 一览 ${{ inputs.tag || github.ref_name }} · Apple Silicon + Intel 双架构
          body_path: release-notes.md
          files: artifacts/*.zip
