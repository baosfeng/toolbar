name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布或重发的 tag（如 v1.3.1）"
        required: true

permissions:
  contents: write

jobs:
  package:
    name: Package .app
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # 配置了签名证书则走证书签名，否则由脚本回退 ad-hoc
      HAS_SIGNING_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true

      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          CERT_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # tag 与 App 内的 CFBundleShortVersionString 必须一致：发 v1.13.0 却忘改 plist 时
      # Release 标题写 1.13.0、用户下载到的「关于」却显示 1.12.1，属于静默错版
      # （版本号唯一真源是 build-app.sh 里的内联 Info.plist，仓库中没有独立模板）
      - name: Version matches tag
        working-directory: NetworkMonitor
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          [ -n "${INPUT_TAG:-}" ] && tag_version="${INPUT_TAG#v}"
          plist_version=$(grep -A1 '<key>CFBundleShortVersionString</key>' Scripts/build-app.sh \
            | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p' | head -1)
          echo "tag=${tag_version} plist=${plist_version}"
          if [ "${tag_version}" != "${plist_version}" ]; then
            echo "::error::tag 与 build-app.sh 的 CFBundleShortVersionString ${plist_version} 不一致"
            exit 1
          fi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Build, sign and package
        working-directory: NetworkMonitor
        env:
          BUILD_SYSTEM: default
          SKIP_INSTALL: "1"
          SIGN_IDENTITY: ${{ secrets.SIGNING_IDENTITY || 'NetworkMonitor Local Signing' }}
        run: ./Scripts/build-app.sh release

      - name: Show signature
        working-directory: NetworkMonitor/dist
        run: codesign -dv --verbose=2 NetworkMonitor.app 2>&1 | head -8

      - name: Zip app bundle
        working-directory: NetworkMonitor/dist
        run: ditto -c -k --keepParent NetworkMonitor.app NetworkMonitor.app.zip

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: NetworkMonitor ${{ inputs.tag || github.ref_name }}
          files: NetworkMonitor/dist/NetworkMonitor.app.zip
          generate_release_notes: true
