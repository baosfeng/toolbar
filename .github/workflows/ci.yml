name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个架构都跑满测试：x86_64 分支只有在 Intel runner 上才真的被编译过，
          # 只跑 arm64 时「x86 会不会编译失败」要到发版当天才知道
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 工具链版本要在日志里显式可见：swift-tools-version 是 6.3，
      # runner 默认 Xcode 低于 26 时会在 swift build 第一步直接报「installed version is 6.1.0」
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version || true
          uname -m

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: NetworkMonitor/.build
          key: ${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('NetworkMonitor/Package.swift', 'NetworkMonitor/.swiftpm/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-

      - name: File size gate
        run: bash NetworkMonitor/Scripts/check-file-size.sh

      # 与发版脚本走同一条后端：release.yml 用 build-app.sh（完整 Xcode 环境用默认后端），
      # 本机文档与项目 skill 强制 native。CI 原先只跑默认后端，等于两条路径各自
      # 只验证一半——CI 绿不代表本机能打出的包能发。
      - name: Build (debug)
        working-directory: NetworkMonitor
        run: swift build --disable-sandbox --build-system native

      # release 构建单独跑一遍：生产方法误放进 DEBUG 块时只有这一步会红
      - name: Build (release)
        working-directory: NetworkMonitor
        run: swift build -c release --disable-sandbox --build-system native

      - name: Test
        working-directory: NetworkMonitor
        run: swift run --disable-sandbox --build-system native TestRunner
